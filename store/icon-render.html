<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 128px; height: 128px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b78f8"/>
      <stop offset="100%" stop-color="#5538d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="73" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>
  <!-- Three rings: top C1=(64,42), BL C2=(40,88), BR C3=(88,88), r=31 -->
  <circle cx="64" cy="42" r="31" stroke="white" stroke-width="7" stroke-opacity="0.9" fill="none"/>
  <circle cx="40" cy="88" r="31" stroke="white" stroke-width="7" stroke-opacity="0.9" fill="none"/>
  <circle cx="88" cy="88" r="31" stroke="white" stroke-width="7" stroke-opacity="0.9" fill="none"/>
  <!-- Erase "under" arcs -->
  <path d="M 60.95 72.85 A 31 31 0 0 1 91.05 57.15" stroke="url(#bg)" stroke-width="11.5"/>
  <path d="M 67.05 72.85 A 31 31 0 0 1 36.95 57.15" stroke="url(#bg)" stroke-width="11.5"/>
  <path d="M 64 68.38 A 31 31 0 0 1 64 107.62"       stroke="url(#bg)" stroke-width="11.5"/>
  <!-- Redraw "over" arcs -->
  <path d="M 91.05 57.15 A 31 31 0 0 1 60.95 72.85" stroke="white" stroke-width="7" stroke-opacity="0.9"/>
  <path d="M 36.95 57.15 A 31 31 0 0 1 67.05 72.85" stroke="white" stroke-width="7" stroke-opacity="0.9"/>
  <path d="M 64 107.62 A 31 31 0 0 1 64 68.38"       stroke="white" stroke-width="7" stroke-opacity="0.9"/>
  <!-- Centre glow -->
  <circle cx="64" cy="73" r="26" fill="url(#glow)"/>
</svg>
</body>
</html>
