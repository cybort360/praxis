<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnLoop Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>

  <!-- SVG sprite -->
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
    <symbol id="ic-logo" viewBox="0 0 24 24" fill="none">
      <path d="M12 12C10 9.5 8 8 6 8a4 4 0 0 0 0 8c2 0 4-1.5 6-4Z"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M12 12c2 2.5 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.5-6 4Z"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <polygon points="10.5,10 10.5,14 14.5,12" fill="currentColor"/>
    </symbol>
    <symbol id="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </symbol>
    <symbol id="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </symbol>
    <symbol id="ic-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5"/>
    </symbol>
    <symbol id="ic-key" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="15" r="4"/>
      <path d="m15 9-6.3 6.3M20 4l-5 5M20 9l-5-5"/>
    </symbol>
    <symbol id="ic-brain" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-1.49-4.3A2.5 2.5 0 0 1 6 11.5a2.5 2.5 0 0 1 .5-4.5 2.5 2.5 0 0 1 3-4.5Z"/>
      <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 1.49-4.3A2.5 2.5 0 0 0 18 11.5a2.5 2.5 0 0 0-.5-4.5 2.5 2.5 0 0 0-3-4.5Z"/>
    </symbol>
    <symbol id="ic-zap" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </symbol>
  </svg>

  <div class="page">

    <!-- Top bar -->
    <header class="top-bar">
      <div class="top-bar-brand">
        <div class="logo-badge">
          <svg class="icon icon-md"><use href="#ic-logo"/></svg>
        </div>
        <span class="brand-name">LearnLoop</span>
        <span class="brand-subtitle">Settings</span>
      </div>
      <button id="btn-theme" class="icon-btn" title="Toggle theme">
        <svg class="icon icon-sm" id="theme-icon"><use href="#ic-sun"/></svg>
      </button>
    </header>

    <main class="container">

      <!-- AI Provider -->
      <section class="card">
        <div class="card-header">
          <div class="card-icon-wrap accent">
            <svg class="icon icon-sm"><use href="#ic-key"/></svg>
          </div>
          <h2 class="card-title">AI Provider</h2>
        </div>

        <div class="field">
          <label for="provider">Provider</label>
          <div class="select-wrap">
            <select id="provider">
              <option value="anthropic">Anthropic (Claude)</option>
              <option value="openai">OpenAI (GPT)</option>
              <option value="openrouter">OpenRouter (free models available)</option>
              <option value="groq">Groq (fast · free tier)</option>
              <option value="gemini">Google Gemini</option>
            </select>
            <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
        </div>

        <div class="field">
          <label for="api-key">API Key</label>
          <div class="input-wrap">
            <input type="password" id="api-key" placeholder="Paste your API key here…" autocomplete="off">
            <button class="input-toggle" id="toggle-key" title="Show/hide key" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                   style="width:14px;height:14px">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="model">Model <span class="label-hint">(leave blank for provider default)</span></label>
          <input type="text" id="model" placeholder="e.g. claude-3-5-haiku-latest">
        </div>
      </section>

      <!-- Quiz -->
      <section class="card">
        <div class="card-header">
          <div class="card-icon-wrap purple">
            <svg class="icon icon-sm"><use href="#ic-brain"/></svg>
          </div>
          <h2 class="card-title">Quiz</h2>
        </div>

        <div class="field">
          <label for="difficulty">Difficulty</label>
          <div class="select-wrap">
            <select id="difficulty">
              <option value="easy">Easy — recall questions</option>
              <option value="medium" selected>Medium — mix of recall and application</option>
              <option value="hard">Hard — application and edge cases</option>
            </select>
            <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
        </div>
      </section>

      <!-- Auto-Start -->
      <section class="card">
        <div class="card-header">
          <div class="card-icon-wrap teal">
            <svg class="icon icon-sm"><use href="#ic-zap"/></svg>
          </div>
          <h2 class="card-title">Auto-Start</h2>
        </div>

        <div class="toggle-row">
          <div class="toggle-info">
            <span class="toggle-label">Auto-start quiz on video load</span>
            <span class="toggle-desc">Automatically generate a quiz when a YouTube video opens</span>
          </div>
          <label class="switch" for="auto-start">
            <input type="checkbox" id="auto-start">
            <span class="track"><span class="thumb"></span></span>
          </label>
        </div>

        <div class="field" id="min-watch-field">
          <label>Minimum watch percentage</label>
          <p class="field-hint">Wait until this much of the video has played before auto-starting</p>
          <div class="pill-group" id="min-watch-pills">
            <button class="pill" data-value="0">Immediately</button>
            <button class="pill" data-value="10">10%</button>
            <button class="pill" data-value="25">25%</button>
            <button class="pill" data-value="50">50%</button>
            <button class="pill" data-value="75">75%</button>
          </div>
          <input type="hidden" id="min-watch" value="0">
        </div>
      </section>

      <!-- Footer -->
      <div class="page-footer">
        <button id="save-btn" class="btn-primary">
          <svg class="icon icon-sm"><use href="#ic-check"/></svg>
          Save Settings
        </button>
        <p id="status-msg" class="status-msg"></p>
      </div>

    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
