<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LearnLoop</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 220px;
      background: #0f0f13;
      color: #e8e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    .logo {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #7c6af7;
    }
    .status {
      font-size: 12px;
      color: #888;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .status strong { color: #e8e8f0; font-weight: 500; }
    .btn {
      display: block;
      width: 100%;
      background: #7c6af7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 12px;
      cursor: pointer;
      margin-bottom: 8px;
      text-align: center;
    }
    .btn:hover { background: #6b5ce7; }
    .btn-secondary {
      background: #1a1a24;
      color: #e8e8f0;
      border: 1px solid #2a2a3a;
    }
    .btn-secondary:hover { background: #2a2a3a; }
  </style>
</head>
<body>
  <div class="logo">LearnLoop</div>
  <div class="status" id="status">Loading…</div>
  <button class="btn" id="btn-panel">Open Side Panel</button>
  <button class="btn btn-secondary" id="btn-settings">⚙ Settings</button>
  <script src="popup.js"></script>
</body>
</html>
