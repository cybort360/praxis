<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LearnLoop Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      padding: 16px;
      background: #0f0f13;
      color: #e8e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }
    .logo { font-size: 18px; font-weight: 700; color: #7c6af7; margin-bottom: 16px; }
    label { display: block; font-size: 11px; color: #888899; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; margin-top: 12px; }
    select, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      background: #1a1a22;
      border: 1px solid #2e2e3e;
      border-radius: 6px;
      color: #e8e8f0;
      font-size: 13px;
    }
    select:focus, input:focus { outline: none; border-color: #7c6af7; }
    .btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 9px;
      background: #7c6af7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #9585ff; }
    .status { margin-top: 10px; font-size: 12px; color: #3dba77; text-align: center; min-height: 16px; }
    .divider { border: none; border-top: 1px solid #2e2e3e; margin: 16px 0 4px; }
  </style>
</head>
<body>
  <div class="logo">⟳ LearnLoop</div>

  <label for="provider">AI Provider</label>
  <select id="provider">
    <option value="anthropic">Anthropic (Claude)</option>
    <option value="openai">OpenAI (GPT)</option>
  </select>

  <label for="api-key">API Key</label>
  <input type="password" id="api-key" placeholder="Paste your API key here" autocomplete="off" />

  <label for="model">Model (optional override)</label>
  <input type="text" id="model" placeholder="Leave blank for default" />

  <button class="btn" id="btn-save">Save Settings</button>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
